[project]
name = "cave"
version = "0.1.0"
description = "Run Claude Code in a disposable Linux micro-VM on macOS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cave = "cave.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib -p cave._testing.fixtures -n auto"
markers = [
    "vm: boots real VMs through Apple container (slow)",
    "claude_api: runs real Claude sessions, which use real tokens",
]
